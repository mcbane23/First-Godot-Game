name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4-stable
  GODOT_TEMPLATE_DIR: 4.4.stable
  ANDROID_BUILD_TOOLS: 33.0.2
  ANDROID_PLATFORM: android-33

jobs:
  build-android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install matching Android platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Godot and export templates
        run: |
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o godot.zip
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export debug APK
        run: |
          mkdir -p build
          "./Godot_v${GODOT_VERSION}_linux.x86_64" --headless --verbose --export-debug "Android" build/First-Game-debug.apk

      - name: Publish debug build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }}"
          body: |
            Automated debug APK build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            This is a debug-signed development build, not a production release.
          prerelease: true
          files: build/First-Game-debug.apk
