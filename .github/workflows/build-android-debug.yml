name: Build Android debug APK

# Builds automatically once a pull request lands on main. Pushing straight to
# main also triggers it, so every commit that reaches main produces an APK.
# workflow_dispatch keeps the manual "Run workflow" button for one-off builds,
# for example after fixing a secret without changing any tracked file.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4-stable
  GODOT_TEMPLATE_DIR: 4.4.stable
  ANDROID_BUILD_TOOLS: 33.0.2
  ANDROID_PLATFORM: android-33

jobs:
  build-android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install matching Android platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Godot and export templates
        run: |
          # --fail matters as much as the retries: without it curl treats an
          # error page as a successful download and writes it to the output
          # file, so the build fails later with "not a zipfile" instead of
          # reporting the HTTP error where it happened.
          download() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "$1" -o "$2"
          }
          download "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" godot.zip
          download "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" templates.tpz
          ls -l godot.zip templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/

      # The keystore must be the SAME on every run. Generating one per run gives
      # each APK a different signature, and Android refuses to install a build
      # over an existing app signed by a different key.
      #
      # Two sources, in order: the ANDROID_DEBUG_KEYSTORE_BASE64 secret if it is
      # set, otherwise the debug.keystore committed at the repository root. The
      # committed key is a development convenience and is public to anyone who
      # can read the repository, so it must not sign builds handed to testers or
      # published. Adding the secret is all it takes to switch over; see README
      # "Android debug signing".
      - name: Restore debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the ANDROID_DEBUG_KEYSTORE_BASE64 secret."
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
              echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is set but is not valid base64. It must hold the base64 TEXT of debug.keystore; the raw binary file cannot be stored as a secret."
              exit 1
            fi
          elif [ -f debug.keystore ]; then
            echo "::warning::Signing with the debug.keystore committed to this repository. Anyone who can read the repository can sign builds that Android accepts as updates to this app. Set the ANDROID_DEBUG_KEYSTORE_BASE64 secret before distributing builds."
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "::error::No signing key available: the ANDROID_DEBUG_KEYSTORE_BASE64 secret is unset and debug.keystore is not present at the repository root. See the 'Android debug signing' section of README.md."
            exit 1
          fi

          echo "Keystore is $(stat -c%s ~/.android/debug.keystore) bytes."
          if ! keytool -list -v -keystore ~/.android/debug.keystore \
                 -storepass "$KEYSTORE_PASSWORD" > /tmp/keystore-info.txt 2>&1; then
            echo "::error::That file is not a readable keystore, or ANDROID_DEBUG_KEYSTORE_PASSWORD does not match the one it was created with. keytool reported:"
            head -n 10 /tmp/keystore-info.txt
            exit 1
          fi
          echo "Signing certificate:"
          grep -E "Alias name|SHA256:" /tmp/keystore-info.txt || true

      - name: Configure Godot editor settings
        env:
          KEYSTORE_USER: ${{ secrets.ANDROID_DEBUG_KEYSTORE_USER || 'androiddebugkey' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "$KEYSTORE_USER"
          export/android/debug_keystore_pass = "$KEYSTORE_PASSWORD"
          EOF

      # Android will not install a build whose versionCode is lower than the
      # installed one, so derive it from the run number to keep it increasing.
      - name: Set version code from run number
        run: |
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          grep -E "^version/(code|name)=" export_presets.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          "./Godot_v${GODOT_VERSION}_linux.x86_64" --headless --verbose --export-debug "Android" build/Knights-debug.apk

      - name: Publish debug build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }}"
          body: |
            Automated debug APK build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            This is a debug-signed development build, not a production release.
          prerelease: true
          files: build/Knights-debug.apk
