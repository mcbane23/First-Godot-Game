name: Build Android debug APK

# Builds automatically once a pull request lands on main. Pushing straight to
# main also triggers it, so every commit that reaches main produces an APK.
on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4-stable
  GODOT_TEMPLATE_DIR: 4.4.stable
  ANDROID_BUILD_TOOLS: 33.0.2
  ANDROID_PLATFORM: android-33

jobs:
  build-android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install matching Android platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Godot and export templates
        run: |
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o godot.zip
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/

      # The keystore must be the SAME on every run. Generating one per run gives
      # each APK a different signature, and Android refuses to install a build
      # over an existing app signed by a different key. See README "Android debug
      # signing" for the one-time setup of these secrets.
      - name: Restore debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Builds would otherwise be signed with a throwaway key and could not be installed as updates. See the 'Android debug signing' section of README.md for the one-time setup."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "Restored keystore ($(stat -c%s ~/.android/debug.keystore) bytes). Signing certificate:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "Alias name|SHA256:" || true

      - name: Configure Godot editor settings
        env:
          KEYSTORE_USER: ${{ secrets.ANDROID_DEBUG_KEYSTORE_USER || 'androiddebugkey' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "$KEYSTORE_USER"
          export/android/debug_keystore_pass = "$KEYSTORE_PASSWORD"
          EOF

      # Android will not install a build whose versionCode is lower than the
      # installed one, so derive it from the run number to keep it increasing.
      - name: Set version code from run number
        run: |
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          grep -E "^version/(code|name)=" export_presets.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          "./Godot_v${GODOT_VERSION}_linux.x86_64" --headless --verbose --export-debug "Android" build/Knights-debug.apk

      - name: Publish debug build as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Debug build #${{ github.run_number }}"
          body: |
            Automated debug APK build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            This is a debug-signed development build, not a production release.
          prerelease: true
          files: build/Knights-debug.apk
